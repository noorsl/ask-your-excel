<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads Board</title>
<meta name="description" content="A drag-and-drop pipeline for real estate leads: follow-ups, budgets and win rate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec; --card:#fff; --ink:#1f2433; --muted:#6b6f7b; --line:#e4dfd6;
  --navy:#1f2a44; --terra:#c4623c; --terra-soft:#f7e6dd; --ok:#2f7d5b; --ok-soft:#e3f1ea; --bad:#b23a3a; --bad-soft:#f8e3e3; --warn:#b7791f;
  --s-new:#5b7bd5; --s-contacted:#8a6fd1; --s-viewing:#d19a2e; --s-negotiation:#c4623c; --s-won:#2f7d5b; --s-lost:#8b8f99;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 "DM Sans",system-ui,sans-serif}
h1,h2,.serif{font-family:Fraunces,Georgia,serif}
header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:36px;height:36px;border-radius:10px;background:var(--terra);display:grid;place-items:center}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header p{margin:0;color:#b9c0d4;font-size:13px}
header .sp{flex:1}
button{font:600 14px "DM Sans",system-ui,sans-serif;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--terra)}
button.primary{background:var(--terra);border-color:var(--terra);color:#fff}
header button{background:transparent;color:#fff;border-color:#3b4768}
header button.primary{background:var(--terra);border-color:var(--terra)}
.wrap{padding:18px 24px 30px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:26px;line-height:1.25;white-space:nowrap}
.stat span{color:var(--muted);font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{font:500 14px "DM Sans",system-ui,sans-serif;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.bar input[type=search]{flex:1;min-width:200px}
.chk{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#ebe6dd;border-radius:14px;padding:10px;min-height:320px;display:flex;flex-direction:column;transition:background .12s}
.col.over{background:#e1d6c6;outline:2px dashed var(--terra);outline-offset:-2px}
.col h2{font:700 14px "DM Sans",sans-serif;margin:2px 4px 2px;display:flex;align-items:center;gap:7px}
.col h2 i{width:9px;height:9px;border-radius:50%}
.col h2 em{font-style:normal;margin-left:auto;background:#fff;border-radius:99px;padding:0 8px;font-size:12px;color:var(--muted)}
.col .sum{font-size:12px;color:var(--muted);margin:0 4px 8px}
.cards{display:flex;flex-direction:column;gap:8px;flex:1}
.lead{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:11px;padding:10px 11px;cursor:grab;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.lead:hover{border-color:#d4cbbd;border-left-color:var(--c)}
.lead:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.lead.dragging{opacity:.45}
.lead .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lead h3{margin:0;font-size:15px}
.lead .budget{font-weight:700;white-space:nowrap}
.lead .meta{color:var(--muted);font-size:13px;margin:3px 0 7px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#f1eee8;color:#4b4f5c}
.chip.due{background:var(--bad-soft);color:var(--bad)}
.chip.today{background:#fbefd6;color:var(--warn)}
.chip.hot{background:var(--terra-soft);color:var(--terra)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px;border:1.5px dashed #d3cbbd;border-radius:10px}
.lower{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h2{font-size:18px;margin:0 0 10px}
.src{display:grid;grid-template-columns:110px 1fr 58px 64px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.src .track{height:12px;background:#f1eee8;border-radius:6px;overflow:hidden;display:flex}
.src .track i{display:block;height:100%}
.src .n,.src .w{text-align:right;font-variant-numeric:tabular-nums}
.src .w{font-weight:700}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.fu{list-style:none;margin:0;padding:0}
.fu li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.fu li:last-child{border-bottom:0}
.fu .d{min-width:74px;font-weight:700;font-size:13px}
.fu .d.late{color:var(--bad)}.fu .d.now{color:var(--warn)}
.fu .t{flex:1;min-width:0}.fu .t small{display:block;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(20,25,40,.3)}
dialog::backdrop{background:rgba(20,25,40,.45)}
form.f{padding:20px 22px}
form.f h2{margin:0 0 14px;font-size:21px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.g label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.g label.full{grid-column:1/-1}
.g input,.g select,.g textarea{font:500 14px "DM Sans",system-ui,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
.g textarea{min-height:64px;resize:vertical}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.acts .del{margin-right:auto;color:var(--bad)}
.hist{font-size:12.5px;color:var(--muted);margin-top:12px;max-height:110px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:13px;padding:0 24px 26px}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}}
@media (max-width:560px){.wrap{padding:14px 12px}header{padding:12px 14px}.board{grid-template-columns:repeat(6,82vw)}.g{grid-template-columns:1fr}.stat b{font-size:22px}.src{grid-template-columns:86px 1fr 40px 54px}}
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>
  <div><h1>Leads Board</h1><p>Real estate pipeline · drag a lead to move it</p></div>
  <span class="sp"></span>
  <button id="btnExport">Export CSV</button>
  <button id="btnAdd" class="primary">+ New lead</button>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search name, district or notes" aria-label="Search leads">
    <select id="fAgent" aria-label="Agent"></select>
    <select id="fType" aria-label="Property type"></select>
    <select id="fSource" aria-label="Source"></select>
    <label class="chk"><input type="checkbox" id="fDue"> Follow-ups due</label>
  </div>
  <div class="board" id="board"></div>
  <div class="lower">
    <div class="panel">
      <h2>Where leads come from</h2>
      <div id="sources"></div>
      <div class="legend"><span><i style="background:var(--s-won)"></i>Won</span><span><i style="background:var(--terra)"></i>Active</span><span><i style="background:var(--s-lost)"></i>Lost</span><span style="margin-left:auto">leads · win rate</span></div>
    </div>
    <div class="panel">
      <h2>Next follow-ups</h2>
      <ul class="fu" id="followups"></ul>
    </div>
  </div>
</div>
<footer>Sample data is fictional. Everything is saved only in this browser (localStorage). <button id="btnReset" style="padding:4px 10px;font-size:13px">Reset demo data</button></footer>

<dialog id="dlg">
  <form class="f" id="form" method="dialog">
    <h2 id="dlgTitle">New lead</h2>
    <div class="g">
      <label>Client name<input name="name" required maxlength="60"></label>
      <label>Phone<input name="phone" maxlength="20" placeholder="05X XXX XXXX"></label>
      <label>Property type<select name="type"></select></label>
      <label>Deal<select name="deal"><option>Buy</option><option>Rent</option></select></label>
      <label>City<select name="city"></select></label>
      <label>District / area<input name="district" maxlength="40"></label>
      <label>Budget (SAR)<input name="budget" type="number" min="0" step="1000" required></label>
      <label>Source<select name="source"></select></label>
      <label>Agent<select name="agent"></select></label>
      <label>Stage<select name="stage"></select></label>
      <label>Next follow-up<input name="follow" type="date"></label>
      <label>Priority<select name="hot"><option value="">Normal</option><option value="1">Hot lead</option></select></label>
      <label class="full">Notes<textarea name="notes" maxlength="400"></textarea></label>
    </div>
    <div class="hist" id="hist"></div>
    <div class="acts">
      <button type="button" class="del" id="btnDel">Delete</button>
      <button type="button" id="btnCancel">Cancel</button>
      <button type="submit" class="primary" id="btnSave">Save lead</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
var KEY = 'leads-board-v3';
var STAGES = [
  { id: 'new', name: 'New', c: 'var(--s-new)' },
  { id: 'contacted', name: 'Contacted', c: 'var(--s-contacted)' },
  { id: 'viewing', name: 'Viewing', c: 'var(--s-viewing)' },
  { id: 'negotiation', name: 'Negotiation', c: 'var(--s-negotiation)' },
  { id: 'won', name: 'Won', c: 'var(--s-won)' },
  { id: 'lost', name: 'Lost', c: 'var(--s-lost)' }
];
var TYPES = ['Apartment', 'Villa', 'Townhouse', 'Land', 'Office', 'Shop'];
var CITIES = ['Riyadh', 'Jeddah', 'Dammam', 'Khobar', 'Tabuk', 'Madinah', 'Makkah'];
var SOURCES = ['Website', 'Instagram', 'Referral', 'Walk-in', 'Property portal', 'Snapchat'];
var AGENTS = ['Bothynah', 'Mohammed', 'Basma', 'Shurooq'];
var DAY = 864e5;
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function today(){ var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function iso(d){ var z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); }
function addDays(n){ return iso(new Date(today().getTime() + n * DAY)); }
function sar(n){
  n = +n || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return String(n);
}
function sarFull(n){ return 'SAR ' + (+n || 0).toLocaleString('en-US'); }
function dayDiff(s){ if (!s) return null; var d = new Date(s + 'T00:00:00'); return Math.round((d - today()) / DAY); }
function fmtDue(s){
  var n = dayDiff(s); if (n == null) return '';
  if (n < 0) return (-n) + 'd overdue'; if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow';
  var d = new Date(s + 'T00:00:00'); return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}

/* ---------- data ---------- */
function seed(){
  var L = [
    ['Abdullah Alharbi', 'Villa', 'Buy', 'Riyadh', 'Al Malqa', 2400000, 'Referral', 'Bothynah', 'negotiation', -1, 1, 'Wants 5 bedrooms, near a school. Counter-offer sent.'],
    ['Maha Alqahtani', 'Apartment', 'Rent', 'Riyadh', 'Al Yasmin', 75000, 'Instagram', 'Basma', 'new', 0, 0, 'Asked about 3BR yearly rent.'],
    ['Faisal Alotaibi', 'Land', 'Buy', 'Riyadh', 'Al Narjis', 1800000, 'Property portal', 'Mohammed', 'viewing', 2, 0, 'Site visit booked with owner.'],
    ['Reem Alzahrani', 'Apartment', 'Buy', 'Jeddah', 'Al Shati', 1150000, 'Website', 'Shurooq', 'contacted', 1, 1, 'Sea view preferred. Mortgage pre-approved.'],
    ['Khalid Aldossary', 'Office', 'Rent', 'Dammam', 'Al Faisaliyah', 240000, 'Referral', 'Mohammed', 'negotiation', 3, 0, 'Needs 250 m², fitted.'],
    ['Nouf Alshehri', 'Townhouse', 'Buy', 'Khobar', 'Al Olaya', 1650000, 'Snapchat', 'Shurooq', 'viewing', -2, 0, 'Second viewing requested with family.'],
    ['Turki Almutairi', 'Villa', 'Buy', 'Riyadh', 'Hittin', 3900000, 'Walk-in', 'Bothynah', 'won', null, 0, 'Deal closed. Handover next month.'],
    ['Hessa Alanazi', 'Apartment', 'Rent', 'Tabuk', 'Al Muruj', 38000, 'Website', 'Basma', 'new', 1, 0, ''],
    ['Majed Alghamdi', 'Shop', 'Rent', 'Jeddah', 'Al Rawdah', 180000, 'Property portal', 'Shurooq', 'lost', null, 0, 'Chose a cheaper location.'],
    ['Lama Alsubaie', 'Apartment', 'Buy', 'Madinah', 'Qurban', 820000, 'Instagram', 'Basma', 'contacted', -3, 0, 'Did not answer last two calls.'],
    ['Saud Alshammari', 'Villa', 'Buy', 'Dammam', 'Al Shulah', 2100000, 'Referral', 'Mohammed', 'won', null, 0, 'Signed. Referred by previous client.'],
    ['Amal Albalawi', 'Land', 'Buy', 'Tabuk', 'King Fahd', 650000, 'Walk-in', 'Bothynah', 'new', 0, 1, 'Cash buyer, wants corner plot.'],
    ['Yasser Alamri', 'Apartment', 'Rent', 'Riyadh', 'Al Aqiq', 95000, 'Snapchat', 'Basma', 'viewing', 1, 0, ''],
    ['Dana Alrashid', 'Townhouse', 'Buy', 'Riyadh', 'Al Arid', 1450000, 'Website', 'Bothynah', 'lost', null, 0, 'Budget did not match available units.'],
    ['Bandar Alyami', 'Office', 'Buy', 'Riyadh', 'Olaya', 5200000, 'Referral', 'Mohammed', 'contacted', 4, 1, 'Company HQ. Needs parking for 20 cars.'],
    ['Ghada Alsulami', 'Apartment', 'Buy', 'Makkah', 'Al Awali', 990000, 'Property portal', 'Shurooq', 'negotiation', 0, 0, 'Waiting for bank valuation.'],
    ['Nawaf Alenezi', 'Apartment', 'Rent', 'Khobar', 'Al Aqrabiyah', 62000, 'Instagram', 'Basma', 'won', null, 0, 'Lease signed for 1 year.'],
    ['Rawan Aljohani', 'Villa', 'Rent', 'Jeddah', 'Obhur', 210000, 'Instagram', 'Shurooq', 'new', 2, 0, 'Beach area, furnished.']
  ];
  var now = Date.now();
  return L.map(function(a, i){
    var created = now - (12 + (i * 7) % 40) * DAY;
    var st = a[8];
    var span = now - DAY - created;
    var hist = [{ t: created, x: 'Lead created from ' + a[6] }];
    var idx = STAGES.map(function(s){ return s.id; }).indexOf(st);
    for (var k = 1; k <= idx && k <= 4; k++) if (!(st === 'lost' && k > 2)) hist.push({ t: created + span * k / 5, x: 'Moved to ' + STAGES[k].name });
    if (st === 'lost') hist.push({ t: created + span * 0.8, x: 'Moved to Lost' });
    return {
      id: i + 1, name: a[0], phone: '05' + (i % 9 + 1) + ' 000 ' + String(1000 + i * 37).slice(-4), type: a[1], deal: a[2], city: a[3], district: a[4],
      budget: a[5], source: a[6], agent: a[7], stage: st, follow: a[9] == null ? '' : addDays(a[9]), hot: !!a[10], notes: a[11],
      created: created, closed: st === 'won' || st === 'lost' ? created + span * 0.8 : null, hist: hist
    };
  });
}
var leads;
try { leads = JSON.parse(localStorage.getItem(KEY)); } catch (e) { leads = null; }
if (!Array.isArray(leads)) leads = seed();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(leads)); } catch (e) {} }
function nextId(){ return leads.reduce(function(m, l){ return Math.max(m, l.id); }, 0) + 1; }

/* ---------- filters ---------- */
function opts(sel, all, list){ sel.innerHTML = '<option value="">' + all + '</option>' + list.map(function(x){ return '<option>' + esc(x) + '</option>'; }).join(''); }
opts($('#fAgent'), 'All agents', AGENTS); opts($('#fType'), 'All property types', TYPES); opts($('#fSource'), 'All sources', SOURCES);
function visible(){
  var q = $('#q').value.trim().toLowerCase(), ag = $('#fAgent').value, ty = $('#fType').value, so = $('#fSource').value, due = $('#fDue').checked;
  return leads.filter(function(l){
    if (ag && l.agent !== ag) return false;
    if (ty && l.type !== ty) return false;
    if (so && l.source !== so) return false;
    if (due && !(l.follow && dayDiff(l.follow) <= 0 && l.stage !== 'won' && l.stage !== 'lost')) return false;
    if (q && (l.name + ' ' + l.district + ' ' + l.city + ' ' + l.notes + ' ' + l.type).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

/* ---------- render ---------- */
function render(){
  var vis = visible();
  // stats (over all leads, not filtered — the business view)
  var open = leads.filter(function(l){ return l.stage !== 'won' && l.stage !== 'lost'; });
  var won = leads.filter(function(l){ return l.stage === 'won'; }), lost = leads.filter(function(l){ return l.stage === 'lost'; });
  var pipe = open.reduce(function(s, l){ return s + (+l.budget || 0); }, 0);
  var wonV = won.reduce(function(s, l){ return s + (+l.budget || 0); }, 0);
  var rate = won.length + lost.length ? Math.round(won.length / (won.length + lost.length) * 100) : 0;
  var late = open.filter(function(l){ return l.follow && dayDiff(l.follow) < 0; }).length;
  var todayN = open.filter(function(l){ return l.follow && dayDiff(l.follow) === 0; }).length;
  var cycle = won.filter(function(l){ return l.closed; }).map(function(l){ return (l.closed - l.created) / DAY; });
  var avgCycle = cycle.length ? Math.round(cycle.reduce(function(a, b){ return a + b; }, 0) / cycle.length) : null;
  var S = [
    ['Open leads', open.length, leads.length + ' in total'],
    ['Pipeline value', 'SAR ' + sar(pipe), 'budgets of open leads'],
    ['Won', 'SAR ' + sar(wonV), won.length + ' deal' + (won.length === 1 ? '' : 's') + (avgCycle != null ? ' · ~' + avgCycle + ' days to close' : '')],
    ['Win rate', rate + '%', won.length + ' won · ' + lost.length + ' lost'],
    ['Follow-ups', todayN + ' today', late ? '<span style="color:var(--bad);font-weight:700">' + late + ' overdue</span>' : 'none overdue']
  ];
  $('#stats').innerHTML = S.map(function(s){ return '<div class="stat"><small>' + s[0] + '</small><b>' + s[1] + '</b><span>' + s[2] + '</span></div>'; }).join('');

  // board
  $('#board').innerHTML = STAGES.map(function(st){
    var items = vis.filter(function(l){ return l.stage === st.id; }).sort(function(a, b){
      var da = a.follow ? dayDiff(a.follow) : 999, db = b.follow ? dayDiff(b.follow) : 999;
      return (b.hot - a.hot) || (da - db) || (b.budget - a.budget);
    });
    var sum = items.reduce(function(s, l){ return s + (+l.budget || 0); }, 0);
    return '<section class="col" data-stage="' + st.id + '" aria-label="' + st.name + '"><h2><i style="background:' + st.c + '"></i>' + st.name + '<em>' + items.length + '</em></h2><div class="sum">' + (items.length ? 'SAR ' + sar(sum) : '&nbsp;') + '</div><div class="cards">' +
      (items.length ? items.map(function(l){ return card(l, st); }).join('') : '<div class="empty">Drop a lead here</div>') + '</div></section>';
  }).join('');

  // sources
  var rows = SOURCES.map(function(src){
    var ls = leads.filter(function(l){ return l.source === src; });
    var w = ls.filter(function(l){ return l.stage === 'won'; }).length, lo = ls.filter(function(l){ return l.stage === 'lost'; }).length;
    return { src: src, n: ls.length, w: w, lo: lo, a: ls.length - w - lo, rate: w + lo ? Math.round(w / (w + lo) * 100) : null };
  }).sort(function(a, b){ return b.n - a.n; });
  var maxN = Math.max.apply(null, rows.map(function(r){ return r.n; })) || 1;
  $('#sources').innerHTML = rows.map(function(r){
    var pct = function(v){ return (v / maxN * 100).toFixed(1) + '%'; };
    return '<div class="src"><span>' + esc(r.src) + '</span><div class="track" title="' + r.w + ' won · ' + r.a + ' active · ' + r.lo + ' lost"><i style="width:' + pct(r.w) + ';background:var(--s-won)"></i><i style="width:' + pct(r.a) + ';background:var(--terra)"></i><i style="width:' + pct(r.lo) + ';background:var(--s-lost)"></i></div><span class="n">' + r.n + '</span><span class="w">' + (r.rate == null ? '–' : r.rate + '%') + '</span></div>';
  }).join('');

  // follow-ups
  var fu = open.filter(function(l){ return l.follow; }).sort(function(a, b){ return a.follow < b.follow ? -1 : 1; }).slice(0, 7);
  $('#followups').innerHTML = fu.length ? fu.map(function(l){
    var n = dayDiff(l.follow);
    return '<li data-id="' + l.id + '" tabindex="0"><span class="d ' + (n < 0 ? 'late' : n === 0 ? 'now' : '') + '">' + fmtDue(l.follow) + '</span><span class="t">' + esc(l.name) + '<small>' + esc(stageName(l.stage)) + ' · ' + esc(l.type) + ' · ' + esc(l.city) + ' · ' + esc(l.agent) + '</small></span><span class="chip">' + sar(l.budget) + '</span></li>';
  }).join('') : '<li style="cursor:default;color:var(--muted)">No follow-ups scheduled.</li>';
}
function stageName(id){ return (STAGES.filter(function(s){ return s.id === id; })[0] || {}).name || id; }
function card(l, st){
  var chips = [];
  if (l.hot) chips.push('<span class="chip hot">Hot</span>');
  chips.push('<span class="chip">' + esc(l.type) + ' · ' + esc(l.deal) + '</span>');
  if (l.follow && st.id !== 'won' && st.id !== 'lost'){
    var n = dayDiff(l.follow);
    chips.push('<span class="chip ' + (n < 0 ? 'due' : n === 0 ? 'today' : '') + '">↻ ' + fmtDue(l.follow) + '</span>');
  }
  chips.push('<span class="chip">' + esc(l.agent) + '</span>');
  return '<article class="lead" draggable="true" tabindex="0" data-id="' + l.id + '" style="--c:' + st.c + '" aria-label="' + esc(l.name) + ', ' + esc(st.name) + '">' +
    '<div class="top"><h3>' + esc(l.name) + '</h3><span class="budget">' + sar(l.budget) + '</span></div>' +
    '<div class="meta">' + esc(l.district ? l.district + ', ' : '') + esc(l.city) + ' · ' + esc(l.source) + '</div>' +
    '<div class="chips">' + chips.join('') + '</div></article>';
}

/* ---------- moving ---------- */
function moveLead(id, stage){
  var l = leads.filter(function(x){ return x.id === id; })[0];
  if (!l || l.stage === stage) return;
  l.stage = stage;
  l.hist.push({ t: Date.now(), x: 'Moved to ' + stageName(stage) });
  l.closed = stage === 'won' || stage === 'lost' ? Date.now() : null;
  save(); render();
  toast(l.name + ' → ' + stageName(stage) + (stage === 'won' ? ' 🎉' : ''));
}
var dragId = null;
var board = $('#board');
board.addEventListener('dragstart', function(e){
  var c = e.target.closest('.lead'); if (!c) return;
  dragId = +c.getAttribute('data-id'); c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragId));
});
board.addEventListener('dragend', function(e){ var c = e.target.closest('.lead'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(function(x){ x.classList.remove('over'); }); });
board.addEventListener('dragover', function(e){
  var col = e.target.closest('.col'); if (!col || dragId == null) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(function(x){ if (x !== col) x.classList.remove('over'); });
  col.classList.add('over');
});
board.addEventListener('drop', function(e){
  var col = e.target.closest('.col'); if (!col) return;
  e.preventDefault(); col.classList.remove('over');
  var id = dragId != null ? dragId : +e.dataTransfer.getData('text/plain');
  dragId = null;
  moveLead(id, col.getAttribute('data-stage'));
});
board.addEventListener('click', function(e){ var c = e.target.closest('.lead'); if (c) openLead(+c.getAttribute('data-id')); });
// keyboard: Enter opens, ← → moves between stages
board.addEventListener('keydown', function(e){
  var c = e.target.closest('.lead'); if (!c) return;
  var id = +c.getAttribute('data-id'), l = leads.filter(function(x){ return x.id === id; })[0];
  var i = STAGES.map(function(s){ return s.id; }).indexOf(l.stage);
  if (e.key === 'Enter'){ e.preventDefault(); openLead(id); }
  if ((e.key === 'ArrowRight' && i < STAGES.length - 1) || (e.key === 'ArrowLeft' && i > 0)){
    e.preventDefault(); moveLead(id, STAGES[i + (e.key === 'ArrowRight' ? 1 : -1)].id);
    var again = document.querySelector('.lead[data-id="' + id + '"]'); if (again) again.focus();
  }
});
$('#followups').addEventListener('click', function(e){ var li = e.target.closest('li[data-id]'); if (li) openLead(+li.getAttribute('data-id')); });
$('#followups').addEventListener('keydown', function(e){ var li = e.target.closest('li[data-id]'); if (li && e.key === 'Enter') openLead(+li.getAttribute('data-id')); });

/* ---------- dialog ---------- */
var F = $('#form'), editing = null;
function fillSel(name, list, labels){ F.elements[name].innerHTML = list.map(function(v, i){ return '<option value="' + esc(v) + '">' + esc(labels ? labels[i] : v) + '</option>'; }).join(''); }
fillSel('type', TYPES); fillSel('city', CITIES); fillSel('source', SOURCES); fillSel('agent', AGENTS);
fillSel('stage', STAGES.map(function(s){ return s.id; }), STAGES.map(function(s){ return s.name; }));
function openLead(id){
  var l = id ? leads.filter(function(x){ return x.id === id; })[0] : null;
  editing = l;
  $('#dlgTitle').textContent = l ? l.name : 'New lead';
  F.reset();
  var d = l || { name: '', phone: '', type: 'Apartment', deal: 'Buy', city: 'Riyadh', district: '', budget: '', source: 'Website', agent: AGENTS[0], stage: 'new', follow: addDays(1), hot: false, notes: '' };
  ['name', 'phone', 'type', 'deal', 'city', 'district', 'budget', 'source', 'agent', 'stage', 'follow', 'notes'].forEach(function(k){ F.elements[k].value = d[k] == null ? '' : d[k]; });
  F.elements.hot.value = d.hot ? '1' : '';
  $('#btnDel').style.display = l ? '' : 'none';
  $('#hist').innerHTML = l ? l.hist.slice().reverse().map(function(h){ var t = new Date(h.t); return '<div>' + t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' · ' + esc(h.x) + '</div>'; }).join('') : '';
  $('#hist').style.display = l ? '' : 'none';
  $('#dlg').showModal();
  setTimeout(function(){ F.elements.name.focus(); }, 30);
}
F.addEventListener('submit', function(e){
  e.preventDefault();
  var v = {};
  ['name', 'phone', 'type', 'deal', 'city', 'district', 'source', 'agent', 'stage', 'follow', 'notes'].forEach(function(k){ v[k] = F.elements[k].value.trim(); });
  v.budget = Math.max(0, Math.round(+F.elements.budget.value || 0));
  v.hot = F.elements.hot.value === '1';
  if (!v.name){ F.elements.name.focus(); return; }
  if (editing){
    if (editing.stage !== v.stage){ editing.hist.push({ t: Date.now(), x: 'Moved to ' + stageName(v.stage) }); editing.closed = v.stage === 'won' || v.stage === 'lost' ? Date.now() : null; }
    if (editing.follow !== v.follow && v.follow) editing.hist.push({ t: Date.now(), x: 'Follow-up set for ' + fmtDue(v.follow) });
    Object.assign(editing, v);
    toast('Lead updated');
  } else {
    v.id = nextId(); v.created = Date.now(); v.closed = null; v.hist = [{ t: Date.now(), x: 'Lead created from ' + v.source }];
    leads.push(v);
    toast('Lead added to ' + stageName(v.stage));
  }
  save(); render(); $('#dlg').close();
});
$('#btnCancel').onclick = function(){ $('#dlg').close(); };
$('#btnDel').onclick = function(){
  if (!editing || !confirm('Delete ' + editing.name + '?')) return;
  leads = leads.filter(function(l){ return l !== editing; }); save(); render(); $('#dlg').close(); toast('Lead deleted');
};
$('#btnAdd').onclick = function(){ openLead(null); };

/* ---------- misc ---------- */
['q', 'fAgent', 'fType', 'fSource', 'fDue'].forEach(function(id){ $('#' + id).addEventListener('input', render); });
$('#btnReset').onclick = function(){ if (confirm('Replace all leads with the demo data?')){ leads = seed(); save(); render(); toast('Demo data restored'); } };
$('#btnExport').onclick = function(){
  var cols = ['id', 'name', 'phone', 'type', 'deal', 'city', 'district', 'budget', 'source', 'agent', 'stage', 'follow', 'hot', 'notes'];
  var q = function(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var csv = [cols.join(',')].concat(leads.map(function(l){ return cols.map(function(c){ return q(c === 'stage' ? stageName(l.stage) : l[c]); }).join(','); })).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })); a.download = 'leads-' + iso(today()) + '.csv'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
};
var tt;
function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 1800); }
render();
</script>
</body>
</html>
